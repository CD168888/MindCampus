# 生产环境配置 - 所有敏感信息从环境变量读取
# 使用方式：java -jar mc-admin.jar --spring.profiles.active=prod,druid

# 生产环境关闭调试
spring:
  devtools:
    restart:
      enabled: false

# 日志级别调整
logging:
  level:
    com.mc: info
    org.springframework: warn

# 生产环境关闭 Swagger/Knife4j
springdoc:
  swagger-ui:
    enabled: false

knife4j:
  enable: false
  production: true

# Tomcat 线程池调优
server:
  tomcat:
    threads:
      max: 300
      min-spare: 50
