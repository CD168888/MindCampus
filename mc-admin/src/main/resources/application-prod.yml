# =============================================================================
# 生产/打包环境配置文件
# 打包命令: mvn clean package -Dmaven.test.skip=true
# 运行命令: java -jar mc-admin.jar --spring.profiles.active=druid,prod
#
# 部署前请根据实际服务器环境填写以下配置项
# =============================================================================

spring:
  devtools:
    restart:
      enabled: false

  # ---- MySQL 数据库 ----
  datasource:
    druid:
      master:
        url:
        username:
        password:
      statViewServlet:
        login-username:
        login-password:

  # ---- Redis ----
  data:
    redis:
      host:
      port:
      password:

  # ---- DashScope AI ----
  ai:
    dashscope:
      api-key:
    memory:
      redis:
        host:
        port:

  # ---- Neo4j ----
  neo4j:
    uri:
    authentication:
      username:
      password:

  # ---- Milvus ----
  milvus:
    uri:
    token:

  # ---- 邮件 ----
  mail:
    host:
    port:
    username:
    password:

# ---- JWT Token ----
token:
  secret:

# ---- 阿里云 OSS ----
oss:
  endpoint:
  access-key-id:
  access-key-secret:
  bucket-name:

# ---- 文件上传路径 ----
ruoyi:
  profile:

# ---- 日志级别 ----
logging:
  level:
    com.mc: info
    org.springframework: warn

# ---- 关闭 Swagger/Knife4j ----
springdoc:
  swagger-ui:
    enabled: false

knife4j:
  enable: false
  production: true

# ---- Tomcat 线程池调优 ----
server:
  tomcat:
    threads:
      max: 300
      min-spare: 50
