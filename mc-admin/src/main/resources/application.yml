# 项目相关配置
ruoyi:
  # 名称
  name: RuoYi
  # 版本
  version: 3.9.0
  # 版权年份
  copyrightYear: 2025
  # 文件路径（在 application-local.yml 中配置）
  profile: ./uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8080
  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 300
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 50

# 日志配置
logging:
  level:
    com.mc: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid,local
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true
  data:
    # redis 配置（在 application-local.yml 中配置）
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: 0
      password: ${REDIS_PASSWORD:}
      # 连接超时时间
      timeout: 10s
      lettuce:
        pool:
          # 连接池中的最小空闲连接
          min-idle: 0
          # 连接池中的最大空闲连接
          max-idle: 8
          # 连接池的最大数据库连接数
          max-active: 8
          # #连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms

  ai:
    dashscope:
      # DashScope API Key（在 application-local.yml 中配置）
      api-key: ${DASHSCOPE_API_KEY:}
      # HTTP 请求超时时间（生成多道题目需要较长等待）
      timeout: 120s
      chat:
        options:
          model: qwen-plus
          temperature: 0.8
    model:
      name: qwen-vl-max

    memory:
      redis:
        host: ${spring.data.redis.host}
        port: ${spring.data.redis.port}
        timeout: 20000

    # MCP Client 配置：连接外部MCP服务器
    # 推荐使用 Tavily 在线MCP服务（https://www.tavily.com），无需本地部署，申请API Key后配置即可
    # 工具包括：tavily-search（网络搜索）、tavily-extract（网页内容提取）
    mcp:
      client:
        enabled: true
        type: SYNC
        request-timeout: 60s
        # STDIO传输方式：通过 npx mcp-remote 桥接远程SSE服务
        stdio:
          servers-configuration: classpath:mcp-servers.json

  # 邮件服务器配置（在 application-local.yml 中配置）
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    protocol: smtps
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 30000
          writetimeout: 5000
          ssl:
            enable: true
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallback: false
  # Neo4j 图数据库配置（在 application-local.yml 中配置）
  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}

  # Milvus 向量数据库配置（在 application-local.yml 中配置）
  milvus:
    uri: ${MILVUS_URI:http://localhost:19530}
    token: ${MILVUS_TOKEN:}

  # 知识图谱与 RAG 配置
  knowledge:
    embedding:
      model: text-embedding-v3
      dimension: 1024
      batch-size: 25
    rag:
      top-k: 5
      min-score: 0.5
    chunk:
      size: 500
      overlap: 50
      batch-size: 20

  # Jackson 配置
  jackson:
    # 日期格式
    date-format: yyyy-MM-dd HH:mm:ss
    # 时区
    time-zone: GMT+8
    # 反序列化配置
    deserialization:
      # 忽略未知属性
      fail-on-unknown-properties: false

# token配置（在 application-local.yml 中配置）
token:
  header: Authorization
  secret: ${JWT_SECRET:abcdefghijklmnopqrstuvwxyz}
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis Plus配置
mybatis-plus:
  # 搜索指定包别名
  typeAliasesPackage: com.mc.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  helperDialect: mysql
  supportMethodsArguments: true
  params: count=countSql

# Springdoc配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
#    - group: 'default'
#      display-name: '测试模块'
#      paths-to-match: '/**'
#      packages-to-scan: com.mc.web.controller.tool
    - group: 'system'
      display-name: '后台管理模块'
      paths-to-match: '/**'
      packages-to-scan:
        - com.mc.student.controller
        - com.mc.questionnaire.controller

# 防盗链配置
referer:
  # 防盗链开关
  enabled: false
  # 允许的域名列表
  allowed-domains: localhost,127.0.0.1,ruoyi.vip,www.ruoyi.vip

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# knife4j 配置
knife4j:
  enable: true           # 是否启用 knife4j 页面
  production: false      # 是否生产模式（true 会关闭某些调试功能）
  basic:
    enable: false       # 是否启用 knife4j 内置的 basic 访问控制（可选）
    username: ruoyi
    password: 123456
  setting:
    swagger-model-name: 心理健康系统实体类

# oss配置（在 application-local.yml 中配置）
oss:
  endpoint: ${OSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  bucket-name: ${OSS_BUCKET_NAME:}